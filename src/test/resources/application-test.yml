spring:
  datasource:
    url: jdbc:h2:mem:faster_admin;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/h2/data.sql
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ZmFzdGVyLWFkbWluLWRldi1vbmx5LXNlY3JldC1rZXktMzJi
  captcha:
    enabled: false
  upload:
    dir: ./target/test-upload

logging:
  level:
    cn.org.faster: warn
